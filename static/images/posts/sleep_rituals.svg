<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Distant Stars -->
  <circle cx="150" cy="120" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="280" cy="90" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="650" cy="110" r="3" fill="#FDE68A" opacity="0.9" filter="url(#glow3)"/>
  <circle cx="720" cy="220" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="600" cy="280" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="180" cy="260" r="2" fill="#FFFFFF" opacity="0.6"/>

  <!-- Moon & Cozy Cloud -->
  <g transform="translate(400, 195)">
    <!-- Crescent Moon -->
    <path d="M20,-75 C-30,-75 -70,-35 -70,20 C-70,75 -30,115 20,115 C5,100 -5,80 -5,55 C-5,-10 25,-55 60,-65 C45,-72 32,-75 20,-75 Z" fill="url(#moonGrad)" filter="url(#glow3)"/>
    
    <!-- Sleep Zzz -->
    <text x="65" y="-30" font-family="'Rubik', sans-serif" font-size="28" font-weight="700" fill="#FDE68A" opacity="0.9">z</text>
    <text x="95" y="-55" font-family="'Rubik', sans-serif" font-size="36" font-weight="800" fill="#FDE68A" opacity="0.95">Z</text>

    <!-- Cloud Base -->
    <path d="M-110,65 C-130,65 -145,80 -145,100 C-145,120 -130,130 -105,130 L95,130 C125,130 145,115 145,95 C145,78 130,65 110,65 C105,45 85,30 65,35 C50,20 25,20 10,35 C0,30 -20,30 -35,40 C-50,25 -80,25 -95,45 C-105,50 -110,55 -110,65 Z" fill="#6366F1" opacity="0.35" filter="url(#glow3)"/>
  </g>

  <!-- Badge Label -->
  <rect x="40" y="40" width="180" height="38" rx="19" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="130" y="64" font-family="'Rubik', sans-serif" font-size="14" font-weight="600" fill="#FBBF24" text-anchor="middle">🌙 СОН И РЕЖИМ</text>

  <!-- Topic Title on Cover -->
  <text x="40" y="380" font-family="'Rubik', sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Вечерние ритуалы</text>
  <text x="40" y="412" font-family="'Rubik', sans-serif" font-size="16" font-weight="400" fill="#94A3B8">4 шага к спокойному засыпанию без слез и сопротивления</text>
</svg>
