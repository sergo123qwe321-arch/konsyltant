<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>

  <!-- Decorative Orbs -->
  <circle cx="700" cy="80" r="160" fill="#7C3AED" opacity="0.25" filter="url(#glow1)"/>
  <circle cx="120" cy="360" r="140" fill="#06B6D4" opacity="0.2" filter="url(#glow1)"/>

  <!-- Central Speech Bubbles Composition -->
  <g transform="translate(400, 210)">
    <!-- Big Bubble -->
    <path d="M-130,-90 Q0,-120 130,-90 Q180,-30 150,40 Q100,90 -20,95 L-60,135 L-65,92 Q-170,75 -160,-20 Q-150,-70 -130,-90 Z" fill="url(#bubbleGrad)" filter="url(#glow1)"/>
    
    <!-- Inner Small Bubble -->
    <path d="M60,-60 Q120,-80 180,-60 Q210,-20 190,20 Q160,50 80,55 L50,80 L50,52 Q-20,40 -10,-20 Z" fill="#06B6D4" opacity="0.4"/>

    <!-- Letters & Phonetics -->
    <text x="-65" y="10" font-family="'Rubik', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">А</text>
    <text x="-5" y="20" font-family="'Rubik', sans-serif" font-size="44" font-weight="800" fill="#A5F3FC">Б</text>
    <text x="50" y="10" font-family="'Rubik', sans-serif" font-size="50" font-weight="800" fill="#DDD6FE">В</text>
  </g>

  <!-- Badge Label -->
  <rect x="40" y="40" width="220" height="38" rx="19" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="150" y="64" font-family="'Rubik', sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">🗣️ РАЗВИТИЕ РЕЧИ</text>

  <!-- Topic Title on Cover -->
  <text x="40" y="380" font-family="'Rubik', sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Красные флаги в речи</text>
  <text x="40" y="412" font-family="'Rubik', sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Когда действительно пора обратиться к логопеду</text>
</svg>
