<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Calming Zen Ripples -->
  <circle cx="400" cy="210" r="170" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="2"/>
  <circle cx="400" cy="210" r="130" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2"/>
  <circle cx="400" cy="210" r="90" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2"/>

  <!-- Protective Shield & Heart Symbol -->
  <g transform="translate(400, 210)">
    <path d="M0,-85 L70,-45 C70,40 25,85 0,105 C-25,85 -70,40 -70,-45 Z" fill="url(#shieldGrad)" filter="url(#glow2)"/>
    <path d="M0,-25 C15,-50 45,-30 45,0 C45,25 0,55 0,55 C0,55 -45,25 -45,0 C-45,-30 -15,-50 0,-25 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Badge Label -->
  <rect x="40" y="40" width="240" height="38" rx="19" fill="rgba(139, 92, 246, 0.15)" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="160" y="64" font-family="'Rubik', sans-serif" font-size="14" font-weight="600" fill="#C084FC" text-anchor="middle">🧠 ЭМОЦИИ И ПОВЕДЕНИЕ</text>

  <!-- Topic Title on Cover -->
  <text x="40" y="380" font-family="'Rubik', sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Сенсорная перегрузка</text>
  <text x="40" y="412" font-family="'Rubik', sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Как помочь ребенку успокоиться без крика и давления</text>
</svg>
