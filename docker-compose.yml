services:
  db:
    image: postgres:15-alpine
    container_name: konsyltant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-konsyltant}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: konsyltant_web
    restart: always
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-konsyltant}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-konsyltant}
      - BASE_URL=${BASE_URL:-https://xn--g1aj3a.site}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - DEFAULT_NOTIFICATION_EMAIL=${DEFAULT_NOTIFICATION_EMAIL}
      - UNISENDER_API_KEY=${UNISENDER_API_KEY}
      - EXCLUDED_FOLDERS=${EXCLUDED_FOLDERS:-Загрузки,Trash,Archive,Корзина}
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: konsyltant_nginx
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/init-ssl.sh:/docker-entrypoint.d/40-init-ssl.sh:ro
      - ./static:/usr/share/nginx/html/static:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    container_name: konsyltant_certbot
    restart: always
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_etc:
  certbot_var:

